<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Findclo — Toda la moda. Un solo lugar.</title>
    <meta name="description" content="Findclo — La plataforma creada para reunir y simplificar la forma de descubrir moda." />
    <!-- Prevent Theme Flash (FOUC)
         Logic: dark is default for all new visitors.
         Only switch to light if the user previously saved 'light'
         explicitly in localStorage (meaning they toggled it manually). -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('findclo_theme');
          // 'dark' unless the user explicitly chose 'light'
          const theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
